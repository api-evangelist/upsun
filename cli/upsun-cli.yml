version: 5.10.8
repository: https://github.com/upsun/cli
docs: https://developer.upsun.com/cli
reference: https://developer.upsun.com/cli/reference
install:
  - method: homebrew (macOS)
    command: brew install upsun/tap/upsun-cli
  - method: shell script (Linux)
    command: curl -fsSL https://raw.githubusercontent.com/upsun/cli/main/installer.sh | bash
  - method: scoop (Windows)
    command: scoop bucket add upsun https://github.com/upsun/homebrew-tap.git && scoop install upsun
  - method: npm
    command: npm install -g upsun
authentication:
  - upsun auth:browser-login (interactive OAuth via browser)
  - upsun auth:api-token-login (API token for CI/CD; see https://developer.upsun.com/cli/api-tokens)
