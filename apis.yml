- aid: upsun:upsun-mfa-api
  name: Upsun MFA API
  description: "Multi-factor authentication (MFA) requires the user to present two (or more) types of\
    \ evidence (or factors) to prove their identity.\n\nFor example, the evidence might be a password\
    \ and a device-generated code, which show the user has the knowledge factor (\"something you know\"\
    ) \nas well as the possession factor (\"something you have\"). In this way MFA offers good protection\
    \ against the compromise of any single factor, \nsuch as a stolen password.\n\nUsing the MFA API you\
    \ can set up time-based one-time passcodes (TOTP), which can be generated on a single registered device\
    \ (\"something you have\") such as a mobile phone."
  humanURL: https://developer.upsun.com/api-reference
