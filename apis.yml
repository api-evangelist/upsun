- aid: upsun:upsun-autoscaling-api
  name: Upsun Autoscaling API
  description: "Upsun provides native support for autoscaling, allowing your applications to automatically\
    \ adjust based on resource usage.\nThis ensures that your apps remain responsive under load while\
    \ helping you optimize costs.\nYou can configure thresholds for metrics such as CPU, RAM, and request\
    \ latency.  \nResources will automatically scale to meet demand.\nEach container profile assigned\
    \ to an application or service provides a specific combination of CPU and RAM, which you can select\
    \ via the Upsun UI or CLI.\n\nThese endpoints manage autoscaling configurations that are tied to a\n\
    specific environment, and optionally to its child environments.\nYou can define scaling rules based\
    \ on metrics like CPU, memory, or\nrequest latency, and these rules will be applied at both build\
    \ time\nand runtime. For more information on configuring autoscaling for your\nenvironments, see the\
    \ [Autoscaling](https://docs.upsun.com/manage-resources/autoscaling.html) section\nof the documentation."
  humanURL: https://developer.upsun.com/api-reference
  baseURL: https://api.upsun.com
  tags:
  - Autoscaling
  properties:
  - type: OpenAPI
    url: openapi/upsun-autoscaling-api-openapi.yml
  - type: Documentation
