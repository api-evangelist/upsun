aid: upsun
name: Upsun
description: >-
  Upsun is the cloud application platform from Platform.sh that automatically
  builds, deploys, and scales applications with git-driven workflows, preview
  environments per branch, managed services, and usage-based pricing. Its REST
  API at api.upsun.com covers projects, environments, deployments, backups,
  domains, certificates, variables, teams, organizations, subscriptions, and
  observability, secured with OAuth2 API-token exchange, and is complemented
  by a full-featured CLI, Node.js and PHP SDKs, activity webhooks, and an
  official hosted MCP server at mcp.upsun.com.
